<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img"><title>動畫與資料驗收</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">動畫與資料驗收</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">時間 → 局部TRS → 父子階層</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">單位四元數與最短弧SLERP</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">骨骼、inverse bind與蒙皮權重</text><path d="M500 315v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="345" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="383" font-size="22" font-family="sans-serif">相機／深度／ID標註及資料來源</text><path d="M500 405v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="435" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="473" font-size="22" font-family="sans-serif">人工覆核；不連接真實養殖設備</text></svg>