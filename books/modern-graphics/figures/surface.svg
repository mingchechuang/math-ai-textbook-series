<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>表面表示的檢查鏈</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">表面表示的檢查鏈</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">控制點 → 曲線／曲面 → 三角網格</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">頂點索引、繞序、邊界與退化檢查</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">法線逆轉置；UV、切線與手性</text><path d="M500 315v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="345" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="383" font-size="22" font-family="sans-serif">材質資料分清線性RGB及非色彩資料</text></svg>