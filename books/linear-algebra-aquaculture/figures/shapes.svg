<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img"><title>形狀契約</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">形狀契約</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">單筆：x (d×1) → W (m×d) → y (m×1)</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">批次：X (n×d) × Wᵀ (d×m) → Y (n×m)</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">不同特徵必須處理單位、縮放與缺值</text></svg>