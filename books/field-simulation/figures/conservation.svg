<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img"><title>守恆不等於穩定或準確</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">守恆不等於穩定或準確</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">初始總量＋邊界流入＋來源</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">共享面通量成對抵消</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">時間步长與空間誤差分開</text><path d="M500 315v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="345" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="383" font-size="22" font-family="sans-serif">負值與裁切造成的總量改變要記錄</text></svg>