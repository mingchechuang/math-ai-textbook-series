<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img"><title>JVP與VJP的形狀契約</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">JVP與VJP的形狀契約</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">J: m×n；輸入v: n×1</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">Jv: m×1，推送切向量</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">輸出協向量w: m×1</text><path d="M500 315v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="345" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="383" font-size="22" font-family="sans-serif">J^T w: n×1，拉回協向量</text><path d="M500 405v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="435" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="473" font-size="22" font-family="sans-serif">w^T(Jv) = (J^T w)^T v</text></svg>