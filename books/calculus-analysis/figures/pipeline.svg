<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" role="img"><title>Volume IV：從線性近似到分析</title><rect width="100%" height="100%" fill="#f5f8fc"/><text x="40" y="45" font-size="26" font-family="sans-serif">Volume IV：從線性近似到分析</text><rect x="100" y="75" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="113" font-size="22" font-family="sans-serif">極限、範數、緊緻與條件</text><path d="M500 135v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="165" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="203" font-size="22" font-family="sans-serif">導數：線性映射＋小於一階的餘項</text><path d="M500 225v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="255" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="293" font-size="22" font-family="sans-serif">Hessian、約束與最佳化</text><path d="M500 315v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="345" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="383" font-size="22" font-family="sans-serif">積分換變數、幾何與極限交換</text><path d="M500 405v23m-6-6 6 6 6-6" stroke="#42698b" fill="none" stroke-width="2"/><rect x="100" y="435" width="800" height="60" rx="10" fill="#dfedfa" stroke="#42698b"/><text x="125" y="473" font-size="22" font-family="sans-serif">ODE、算子、變分與可稽核專題</text></svg>